<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Bill Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div style="text-align: center;">
            <h1>Food Bill Generator</h1>
        </div>
        
        <!-- Bill Form Section -->
        <div class="top_con">
            <form id="billForm">
                <!-- Hotel Details -->
                <div class="form-group">
                    <label for="hotelName">Hotel Name:</label>
                    <input type="text" id="hotelName" placeholder="Hotel Name" required>
                </div>
                <div class="form-group">
                    <label for="billNo">Bill No:</label>
                    <input type="text" id="billNo" placeholder="Bill No" required>
                </div>
                <div class="form-group">
                    <label for="billDate">Date:</label>
                    <input type="date" id="billDate" required>
                </div>
                <div class="form-group">
                    <label for="billTime">Time:</label>
                    <input type="time" id="billTime" required>
                </div>
                <div class="form-group">
                    <label for="Cashier">Cashier:</label>
                    <input type="text" id="Cashier" required>
                </div>
                <div class="form-group">
                    <label for="hotelAddress">Hotel Address:</label>
                    <textarea id="hotelAddress" placeholder="Hotel Address" required></textarea>
                </div>
                <div class="form-group">
                    <label for="gstin">GSTIN (Optional):</label>
                    <input type="text" id="gstin" placeholder="GST Identification Number">
                </div>
                <div class="form-group">
                    <label for="phone">Phone (Optional):</label>
                    <input type="text" id="phone" placeholder="Phone Number">
                </div>

                <!-- Tax Configuration -->
                <div class="tax-config">
                    <h3>Tax Configuration</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="gstRate">GST Rate (%):</label>
                            <input type="number" id="gstRate" placeholder="18" min="0" max="100" step="0.01" value="18">
                        </div>
                        <div class="form-group">
                            <label for="taxRate">Additional Tax (%):</label>
                            <input type="number" id="taxRate" placeholder="0" min="0" max="100" step="0.01" value="0">
                        </div>
                    </div>
                </div>

                <!-- Template Selection -->
                <div class="form-group">
                    <label for="templateSelect">Choose Invoice Template:</label>
                    <select id="templateSelect" required>
                        <option value="">Select Template</option>
                        <option value="template1">Professional Thermal Receipt</option>
                        <option value="template2">Restaurant Style Receipt</option>
                        <option value="template3">Retail Invoice</option>
                        <option value="template4">Minimal Receipt</option>
                    </select>
                </div>

                <!-- Product Details -->
                <div id="productSection">
                    <h2>Products</h2>
                    <div class="product">
                        <input type="text" class="productName" placeholder="Product Name" required>
                        <input type="number" class="quantity" placeholder="Quantity" min="1" required>
                        <input type="number" class="price" placeholder="Price" min="0" step="0.01" required>
                        <span class="amount">0.00</span>
                    </div>
                </div>
                <button type="button" id="addProduct">Add Product</button>

                <!-- Total Amount -->
                <div class="total-summary">
                    <div class="summary-row">
                        <span>Subtotal:</span>
                        <span id="subtotal">0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>GST (<span id="displayGstRate">18</span>%):</span>
                        <span id="gstAmount">0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>Additional Tax (<span id="displayTaxRate">0</span>%):</span>
                        <span id="additionalTaxAmount">0.00</span>
                    </div>
                    <div class="summary-row total-row">
                        <span><strong>Total Amount:</strong></span>
                        <span id="totalAmount"><strong>0.00</strong></span>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="button" id="generateBill">Generate Bill</button>
            </form>
        </div>

        <!-- Invoice Display Section -->
        <div id="invoiceSection" class="invoice-section" style="display: none;">
            <div class="invoice-controls">
                <button id="downloadPDF" class="download-btn">Download PDF</button>
                <button id="editBill" class="edit-btn">Edit Bill</button>
            </div>
            <div id="invoiceContent"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
